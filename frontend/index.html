<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urdu News Classifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#14213d; --muted:#6b7280; --line:#e5e7eb;
    --brand:#0b6e4f; --brand-2:#094f3a; --accent:#e9f5ef;
    --politics:#3b5bdb; --health:#e03131; --education:#f08c00;
    --economy:#2b8a3e; --sports:#7048e8; --technology:#0c8599;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1115; --card:#181b22; --ink:#eef1f6; --muted:#9aa3b2; --line:#2a2f3a; --accent:#12261e}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
  header{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;padding:28px 16px}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 4px;font-size:1.6rem}
  header p{margin:0;opacity:.85}
  main{padding:24px 0 48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:500}
  .tab[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
  textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:14px;
    background:var(--bg);color:var(--ink);font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Segoe UI",serif;font-size:1.2rem;line-height:2.1}
  textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  button.primary{background:var(--brand);color:#fff;border:0;padding:11px 22px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
  button.primary:hover{background:var(--brand-2)} button:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:10px;font:inherit;cursor:pointer}
  .count{margin-left:auto;color:var(--muted);font-size:.85rem}
  .samples{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;
    font-family:"Noto Nastaliq Urdu",serif;font-size:.95rem}
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .result{display:none}
  .badge{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:12px;color:#fff;font-weight:600;font-size:1.1rem}
  .badge .ur{font-family:"Noto Nastaliq Urdu",serif;font-size:1.3rem}
  .conf{color:var(--muted);margin-left:12px}
  .bars{margin-top:18px;display:grid;gap:10px}
  .bar{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center;font-size:.92rem}
  .track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .fill{height:100%;border-radius:6px;transition:width .5s}
  .ur{font-family:"Noto Nastaliq Urdu",serif}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  td.txt{direction:rtl;text-align:right;font-family:"Noto Nastaliq Urdu",serif;line-height:2}
  .pill{display:inline-block;color:#fff;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
  .note{color:var(--muted);font-size:.85rem;margin-top:14px}
  .error{color:#e03131;margin-top:10px;display:none}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 32px}
  .hidden{display:none}
  @media(max-width:560px){.bar{grid-template-columns:100px 1fr 46px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Urdu News Classifier <span class="ur">· اردو خبروں کی درجہ بندی</span></h1>
    <p>Paste an Urdu headline or article — get its topic instantly.</p>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="single">Single</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="batch">Batch (one per line)</button>
    </div>

    <div id="single">
      <textarea id="text" dir="rtl" placeholder="یہاں خبر لکھیں یا پیسٹ کریں…" maxlength="5000"></textarea>
      <div class="samples" id="samples"></div>
      <div class="row">
        <button class="primary" id="go">Classify</button>
        <button class="ghost" id="clear">Clear</button>
        <span class="count" id="count">0 / 5000</span>
      </div>
    </div>

    <div id="batch" class="hidden">
      <textarea id="batchText" dir="rtl" placeholder="ہر لائن میں ایک خبر (زیادہ سے زیادہ 100)…"></textarea>
      <div class="row"><button class="primary" id="goBatch">Classify all</button></div>
    </div>
    <div class="error" id="err"></div>
  </section>

  <section class="card result" id="resultCard">
    <div><span class="badge" id="badge"></span><span class="conf" id="conf"></span></div>
    <div class="bars" id="bars"></div>
    <p class="note">Automated suggestion — a human editor should confirm before publishing.</p>
  </section>

  <section class="card result" id="batchCard">
    <table><thead><tr><th>Headline</th><th>Topic</th><th>Conf.</th></tr></thead><tbody id="rows"></tbody></table>
  </section>
</main>
<footer id="foot"></footer>

<script>
const COLORS = {politics:'var(--politics)',health:'var(--health)',education:'var(--education)',
  economy:'var(--economy)',sports:'var(--sports)',technology:'var(--technology)'};
const SAMPLES = [
  "پاکستان کرکٹ ٹیم نے سیریز میں شاندار فتح حاصل کر لی",
  "اسٹیٹ بینک نے شرح سود برقرار رکھنے کا فیصلہ کیا",
  "ڈاکٹروں نے موسمی بخار سے بچاؤ کی ہدایات جاری کیں",
  "جامعات میں نئے داخلوں کا اعلان کر دیا گیا",
  "پارلیمنٹ میں نئی قانون سازی پر بحث جاری",
  "ملک میں مصنوعی ذہانت کا نیا تربیتی پروگرام شروع"
];
const $ = id => document.getElementById(id);
const color = l => COLORS[l] || 'var(--brand)';

async function api(path, body){
  const r = await fetch(path, body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : undefined);
  if(!r.ok){ let m = r.statusText; try{ const j = await r.json(); m = typeof j.detail==='string'? j.detail : 'Invalid input'; }catch{} throw new Error(m); }
  return r.json();
}
function showErr(m){ const e=$('err'); e.textContent=m||''; e.style.display=m?'block':'none'; }
const pct = v => (v*100).toFixed(1)+'%';

SAMPLES.forEach(s=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=s; b.dir='rtl';
  b.onclick=()=>{ $('text').value=s; updateCount(); classify(); }; $('samples').appendChild(b); });

function updateCount(){ $('count').textContent = $('text').value.length+' / 5000'; }
$('text').addEventListener('input', updateCount);
$('clear').onclick=()=>{ $('text').value=''; updateCount(); $('resultCard').style.display='none'; showErr(''); };

async function classify(){
  const text=$('text').value.trim(); showErr('');
  if(!text){ showErr('Please enter some Urdu text.'); return; }
  $('go').disabled=true; $('go').textContent='Classifying…';
  try{
    const r = await api('/api/classify',{text});
    $('badge').style.background=color(r.label);
    $('badge').innerHTML = `<span class="ur">${r.label_ur}</span><span>${r.label_en}</span>`;
    $('conf').textContent = 'Confidence '+pct(r.confidence);
    $('bars').innerHTML = r.scores.map(s=>`
      <div class="bar"><span><span class="ur">${s.label_ur}</span> · ${s.label_en}</span>
      <div class="track"><div class="fill" style="width:${s.score*100}%;background:${color(s.label)}"></div></div>
      <span>${pct(s.score)}</span></div>`).join('');
    $('resultCard').style.display='block'; $('batchCard').style.display='none';
  }catch(e){ showErr(e.message); }
  finally{ $('go').disabled=false; $('go').textContent='Classify'; }
}
$('go').onclick=classify;
$('text').addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') classify(); });

$('goBatch').onclick=async()=>{
  showErr('');
  const texts=$('batchText').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!texts.length){ showErr('Enter at least one line.'); return; }
  if(texts.length>100){ showErr('Maximum 100 lines per batch.'); return; }
  $('goBatch').disabled=true;
  try{
    const {results}=await api('/api/classify/batch',{texts});
    $('rows').innerHTML=results.map(r=>`<tr><td class="txt">${r.text.replace(/</g,'&lt;')}</td>
      <td><span class="pill" style="background:${color(r.label)}">${r.label_en}</span></td><td>${pct(r.confidence)}</td></tr>`).join('');
    $('batchCard').style.display='block'; $('resultCard').style.display='none';
  }catch(e){ showErr(e.message); }
  finally{ $('goBatch').disabled=false; }
};

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  $('single').classList.toggle('hidden',t.dataset.tab!=='single');
  $('batch').classList.toggle('hidden',t.dataset.tab!=='batch');
  showErr('');
});

api('/api/metrics').then(m=>{ $('foot').textContent=`Model trained on ${m.n_samples} samples (${m.data_source}) · ${m.cv_folds}-fold CV macro-F1 ${m.cv_macro_f1}`; }).catch(()=>{});
</script>
</body>
</html>
